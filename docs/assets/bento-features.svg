<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bentoCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Sub-ms Redis Lua Locking -->
  <g transform="translate(10, 10)">
    <rect width="350" height="220" rx="10" fill="url(#bentoCardBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#0284c7" fill-opacity="0.15"/>
    <!-- Bolt Icon -->
    <path d="M42,26 L32,42 L40,42 L38,54 L48,38 L40,38 Z" fill="#38bdf8"/>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Sub-ms Redis Lua Locking</text>
    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">
      Atomic capacity checks and decrements evaluated in single-threaded Redis memory space. Guarantees zero overselling under viral traffic spikes.
    </text>
    <rect x="20" y="175" width="140" height="24" rx="12" fill="#1e293b"/>
    <text x="32" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">EVALSHA Fast-Path</text>
  </g>

  <!-- Card 2: Two-Phase Transactional Outbox -->
  <g transform="translate(375, 10)">
    <rect width="350" height="220" rx="10" fill="url(#bentoCardBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#10b981" fill-opacity="0.15"/>
    <!-- Sync Refresh Icon -->
    <path d="M32,40 A8,8 0 1,1 48,40 M48,34 L48,40 L42,40" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Transactional Outbox Relay</text>
    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">
      Domain mutations and outbox events commit in the exact same MongoDB session. Zero dual-write anomalies; resilient exponential backoff worker.
    </text>
    <rect x="20" y="175" width="135" height="24" rx="12" fill="#1e293b"/>
    <text x="32" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">ACID Outbox Relay</text>
  </g>

  <!-- Card 3: Self-Healing Compute Leases -->
  <g transform="translate(740, 10)">
    <rect width="350" height="220" rx="10" fill="url(#bentoCardBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#8b5cf6" fill-opacity="0.15"/>
    <!-- CPU / Mesh Chip Icon -->
    <rect x="33" y="33" width="14" height="14" rx="2" fill="none" stroke="#c084fc" stroke-width="2"/>
    <line x1="40" y1="27" x2="40" y2="33" stroke="#c084fc" stroke-width="2"/>
    <line x1="40" y1="47" x2="40" y2="53" stroke="#c084fc" stroke-width="2"/>
    <line x1="27" y1="40" x2="33" y2="40" stroke="#c084fc" stroke-width="2"/>
    <line x1="47" y1="40" x2="53" y2="40" stroke="#c084fc" stroke-width="2"/>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Self-Healing Compute Mesh</text>
    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">
      Provisions NVIDIA GPUs and preview environments via expiring leases. A 60s background daemon reclaims abandoned zombie compute automatically.
    </text>
    <rect x="20" y="175" width="150" height="24" rx="12" fill="#1e293b"/>
    <text x="32" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc">60s Automated Sweeper</text>
  </g>

  <!-- Card 4: Authentic AWS S3 SigV4 Streaming -->
  <g transform="translate(10, 250)">
    <rect width="350" height="210" rx="10" fill="url(#bentoCardBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#f59e0b" fill-opacity="0.15"/>
    <!-- Cloud Upload Icon -->
    <path d="M30,42 A6,6 0 0,1 42,32 A8,8 0 0,1 52,42" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="41" y1="36" x2="41" y2="48" stroke="#f59e0b" stroke-width="2.5"/>
    <polyline points="37,40 41,36 45,40" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">AWS S3 SigV4 Pre-Signing</text>
    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">
      Asynchronous BullMQ worker streams CSV exports to AWS S3. Cryptographically signed HMAC SigV4 URLs refresh JIT on-demand.
    </text>
    <rect x="20" y="165" width="145" height="24" rx="12" fill="#1e293b"/>
    <text x="32" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f59e0b">JIT Signed AWS URLs</text>
  </g>

  <!-- Card 5: Stripe Metered Billing Sync -->
  <g transform="translate(375, 250)">
    <rect width="350" height="210" rx="10" fill="url(#bentoCardBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#6366f1" fill-opacity="0.15"/>
    <!-- Credit Card / Dollar Icon -->
    <rect x="30" y="32" width="20" height="14" rx="2" fill="none" stroke="#818cf8" stroke-width="2"/>
    <line x1="30" y1="37" x2="50" y2="37" stroke="#818cf8" stroke-width="2"/>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Stripe Metered Billing</text>
    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">
      Calculates hourly compute burn rates in real-time and reports billable units to Stripe Metered Billing API with HMAC webhook synchronization.
    </text>
    <rect x="20" y="165" width="140" height="24" rx="12" fill="#1e293b"/>
    <text x="32" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#818cf8">Meter Event Delivery</text>
  </g>

  <!-- Card 6: Enterprise SCIM v2 & NextAuth v5 -->
  <g transform="translate(740, 250)">
    <rect width="350" height="210" rx="10" fill="url(#bentoCardBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#ec4899" fill-opacity="0.15"/>
    <!-- Shield / Key Icon -->
    <path d="M40,28 L49,32 L49,41 C49,47 40,51 40,51 C40,51 31,47 31,41 L31,32 Z" fill="none" stroke="#f472b6" stroke-width="2"/>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Enterprise SCIM v2 &amp; RBAC</text>
    <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">
      Next.js 15 async route compliant SCIM v2 endpoint for automated Okta, Microsoft Entra, and CyberArk directory lifecycle provisioning.
    </text>
    <rect x="20" y="165" width="140" height="24" rx="12" fill="#1e293b"/>
    <text x="32" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f472b6">Okta &amp; Entra Verified</text>
  </g>
</svg>

