<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Terminal Window Shadow & Frame -->
  <rect x="10" y="10" width="1080" height="340" rx="12" fill="url(#termBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Titlebar -->
  <path d="M 11 11 L 1089 11 A 11 11 0 0 1 1089 45 L 11 45 Z" fill="url(#headerGrad)"/>
  <line x1="10" y1="45" x2="1090" y2="45" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="34" cy="28" r="6" fill="#ef4444"/>
  <circle cx="54" cy="28" r="6" fill="#f59e0b"/>
  <circle cx="74" cy="28" r="6" fill="#10b981"/>

  <!-- Title Text -->
  <text x="550" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="600" fill="#94a3b8">
    bash — pnpm run test:concurrency — 50 Parallel Workers vs 5 Capacity Slots
  </text>

  <!-- Terminal Content Lines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" xml:space="preserve">
    <!-- Command Prompt -->
    <text x="30" y="75" fill="#38bdf8" font-weight="bold">$</text>
    <text x="45" y="75" fill="#f8fafc">pnpm run test:concurrency --workers 50 --capacity 5 --target h100-pool</text>

    <!-- Info Lines -->
    <text x="30" y="102" fill="#64748b">[INIT]</text>
    <text x="80" y="102" fill="#94a3b8">Connected to Redis Cluster (redis://127.0.0.1:6379) &amp; MongoDB Replica Set (rs0)</text>

    <text x="30" y="124" fill="#64748b">[SETUP]</text>
    <text x="80" y="124" fill="#e2e8f0">Target Resource: </text>
    <text x="205" y="124" fill="#38bdf8" font-weight="bold">"NVIDIA H100 GPU Cluster"</text>
    <text x="405" y="124" fill="#94a3b8">| Max Slots: </text>
    <text x="495" y="124" fill="#10b981" font-weight="bold">5</text>
    <text x="515" y="124" fill="#94a3b8">| Simulated Requests: </text>
    <text x="670" y="124" fill="#f59e0b" font-weight="bold">50 Concurrent</text>

    <!-- Execution Trace Lines -->
    <text x="30" y="152" fill="#10b981" filter="url(#cyanGlow)">✔ Worker #01</text>
    <text x="140" y="152" fill="#94a3b8">| Lua EVALSHA: Slot GRANTED | Remainder: </text>
    <text x="450" y="152" fill="#10b981">4</text>
    <text x="470" y="152" fill="#94a3b8">| Mongo Tx: COMMITTED (1.2ms)</text>

    <text x="30" y="174" fill="#10b981" filter="url(#cyanGlow)">✔ Worker #02</text>
    <text x="140" y="174" fill="#94a3b8">| Lua EVALSHA: Slot GRANTED | Remainder: </text>
    <text x="450" y="174" fill="#10b981">3</text>
    <text x="470" y="174" fill="#94a3b8">| Mongo Tx: COMMITTED (1.4ms)</text>

    <text x="30" y="196" fill="#10b981" filter="url(#cyanGlow)">✔ Worker #03</text>
    <text x="140" y="196" fill="#94a3b8">| Lua EVALSHA: Slot GRANTED | Remainder: </text>
    <text x="450" y="196" fill="#10b981">2</text>
    <text x="470" y="196" fill="#94a3b8">| Mongo Tx: COMMITTED (1.1ms)</text>

    <text x="30" y="218" fill="#10b981" filter="url(#cyanGlow)">✔ Worker #04</text>
    <text x="140" y="218" fill="#94a3b8">| Lua EVALSHA: Slot GRANTED | Remainder: </text>
    <text x="450" y="218" fill="#10b981">1</text>
    <text x="470" y="218" fill="#94a3b8">| Mongo Tx: COMMITTED (1.5ms)</text>

    <text x="30" y="240" fill="#10b981" filter="url(#cyanGlow)">✔ Worker #05</text>
    <text x="140" y="240" fill="#94a3b8">| Lua EVALSHA: Slot GRANTED | Remainder: </text>
    <text x="450" y="240" fill="#f59e0b" font-weight="bold">0 (SOLD OUT)</text>
    <text x="560" y="240" fill="#94a3b8">| Mongo Tx: COMMITTED (1.3ms)</text>

    <text x="30" y="262" fill="#ef4444">✘ Worker #06..50</text>
    <text x="160" y="262" fill="#ef4444">| Fast-path Lua Lock REJECTED (45 requests throttled with 409 Conflict in 0.3ms)</text>

    <!-- Summary Box -->
    <line x1="30" y1="280" x2="1070" y2="280" stroke="#1e293b" stroke-width="1"/>
    <text x="30" y="306" fill="#10b981" font-weight="bold">PASS</text>
    <text x="75" y="306" fill="#f8fafc">Verified: Successful Allocations = </text>
    <text x="310" y="306" fill="#10b981" font-weight="bold">5</text>
    <text x="330" y="306" fill="#f8fafc">| Total Oversold = </text>
    <text x="460" y="306" fill="#10b981" font-weight="bold">0</text>
    <text x="485" y="306" fill="#f8fafc">| Redis Counter = </text>
    <text x="595" y="306" fill="#38bdf8" font-weight="bold">0</text>
    <text x="615" y="306" fill="#f8fafc">| MongoDB attendeeCount = </text>
    <text x="805" y="306" fill="#38bdf8" font-weight="bold">5</text>
    <text x="825" y="306" fill="#94a3b8">(100% Lockstep Parity)</text>
    
    <text x="30" y="328" fill="#64748b">Test duration: 242ms | Database locks: 0 | Deadlocks: 0 | CPU Spike: &lt; 2%</text>
  </g>
</svg>

