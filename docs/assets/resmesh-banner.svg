<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="meshGlowCyan" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshGlowPurple" cx="80%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent Linear Gradients -->
    <linearGradient id="textGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    
    <linearGradient id="gridLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Filter for node glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect width="1200" height="340" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" fill="url(#meshGlowCyan)"/>
  <rect width="1200" height="340" fill="url(#meshGlowPurple)"/>

  <!-- Geometric Reservation Grid Lines -->
  <g stroke="url(#gridLine)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>

    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="350" y1="0" x2="350" y2="340"/>
    <line x1="550" y1="0" x2="550" y2="340"/>
    <line x1="750" y1="0" x2="750" y2="340"/>
    <line x1="950" y1="0" x2="950" y2="340"/>
    <line x1="1100" y1="0" x2="1100" y2="340"/>
  </g>

  <!-- Abstract Mesh Neural Topology (Floating Constellation) -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="100" y1="190" x2="180" y2="130"/>
    <line x1="180" y1="130" x2="260" y2="160"/>
    <line x1="260" y1="160" x2="200" y2="230"/>
    <line x1="200" y1="230" x2="100" y2="190"/>
    <line x1="180" y1="130" x2="200" y2="230"/>
    
    <line x1="980" y1="140" x2="1050" y2="80"/>
    <line x1="1050" y1="80" x2="1120" y2="150"/>
    <line x1="1120" y1="150" x2="1070" y2="220"/>
    <line x1="1070" y1="220" x2="980" y2="140"/>
    <line x1="1050" y1="80" x2="1070" y2="220"/>
  </g>

  <!-- Glowing Mesh Nodes -->
  <g filter="url(#glow)">
    <circle cx="100" cy="190" r="4" fill="#38bdf8"/>
    <circle cx="180" cy="130" r="5" fill="#818cf8"/>
    <circle cx="260" cy="160" r="4" fill="#c084fc"/>
    <circle cx="200" cy="230" r="4.5" fill="#38bdf8"/>

    <circle cx="980" cy="140" r="4" fill="#818cf8"/>
    <circle cx="1050" cy="80" r="5" fill="#38bdf8"/>
    <circle cx="1120" cy="150" r="4" fill="#c084fc"/>
    <circle cx="1070" cy="220" r="4.5" fill="#818cf8"/>
  </g>

  <!-- Center Identity: Logo Mark & Title -->
  <!-- Hexagonal Tech Shield Icon -->
  <g transform="translate(600, 75)">
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="url(#textGradCyan)" opacity="0.15"/>
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="none" stroke="url(#textGradCyan)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Inner Core Symbol (Infinity / Pulse) -->
    <path d="M-12,0 C-12,-8 -2,-8 0,0 C2,8 12,8 12,0 C12,-8 2,-8 0,0 C-2,8 -12,8 -12,0 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
    evenregman <tspan fill="url(#textGradCyan)">// ResMesh</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    High-Concurrency Ticketing Engine &amp; Enterprise AI Compute Reservation Mesh
  </text>

  <!-- Feature Badge Pills -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: Atomic Lua Concurrency -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="195" height="32" rx="16" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#10b981" filter="url(#glow)"/>
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Atomic Redis Lua Engine</text>
    </g>

    <!-- Pill 2: ACID Replica Set -->
    <g transform="translate(-110, 0)">
      <rect x="0" y="0" width="200" height="32" rx="16" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#38bdf8" filter="url(#glow)"/>
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">MongoDB ACID Replica Set</text>
    </g>

    <!-- Pill 3: Self-Healing Leases -->
    <g transform="translate(105, 0)">
      <rect x="0" y="0" width="180" height="32" rx="16" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#8b5cf6" filter="url(#glow)"/>
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Self-Healing TTL Leases</text>
    </g>

    <!-- Pill 4: Stripe & AWS S3 -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="140" height="32" rx="16" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#f59e0b" filter="url(#glow)"/>
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">AWS S3 + Stripe</text>
    </g>
  </g>

  <!-- Frame Border -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="8" fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>

